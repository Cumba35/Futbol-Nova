name: Fútbol Nova Native Android ARM64
on:
  push:
    branches: [ "work/native-3d-engine" ]
    paths:
      - "native-android/**"
      - ".github/workflows/futbol-nova-native-android.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "native-android/**"
      - ".github/workflows/futbol-nova-native-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile native Android APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and ARM64 native library
        run: |
          APK="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libfutbolnova.so"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-native-android-arm64
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
