name: Fútbol Nova - pruebas y APK Android

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - '.github/workflows/futbol-nova-android-apk.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - 'tests/**'
      - 'assets/**'
      - 'modules/**'
      - 'tools/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/futbol-nova-android-apk.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - 'tests/**'
      - 'assets/**'
      - 'modules/**'
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: futbol-nova-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Godot Android editor source
        shell: bash
        run: |
          zip -qr "$RUNNER_TEMP/FutbolNova-Godot-Source.zip" . \
            -x './.git/*' './.godot/*' './build/*' './.import/*'
          test -s "$RUNNER_TEMP/FutbolNova-Godot-Source.zip"

      - name: Upload Godot source project
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-godot-source
          path: ${{ runner.temp }}/FutbolNova-Godot-Source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/futbol-nova-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/futbol-nova-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify raw source datasets stay outside Godot resource imports
        shell: bash
        run: |
          test -f data/imports/.gdignore
          test -f data/imports/spain_2026_27_club_membership.csv
          test -f data/imports/verified_club_membership.csv
          test -f data/imports/verified_player_squads.csv

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Validate original club display names
        run: python tools/validate_club_identity_names.py

      - name: Validate historical competition archive
        run: python tools/validate_historical_competitions.py

      - name: Core test — base input actions
        run: timeout --signal=TERM --kill-after=15s 60s godot --headless --path . --script res://tests/test_input_actions.gd

      - name: Core test — hub and main screens
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_game_hub.gd

      - name: Core test — ball flight model
        run: timeout --signal=TERM --kill-after=15s 120s godot --headless --path . --script res://tests/test_ball_flight_model.gd

      - name: Core test — 11v11 match foundation
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_match_11v11_foundation.gd

      - name: Core test — live friendly match, goals and periods
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_friendly_match_runtime.gd

      - name: Core test — physical goal frames and net containment
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_goal_frame_physics.gd

      - name: Core test — procedural stadium catalog and geometry
        run: timeout --signal=TERM --kill-after=15s 120s godot --headless --path . --script res://tests/test_stadium_builder.gd

      - name: Core test — Máximo Padilla player profile
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_maximo_padilla_profile.gd

      - name: Core test — NOVA owner access
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_nova_owner_access.gd

      - name: Core test — NOVA resource policy
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_nova_resource_policy.gd

      - name: Smoke test the Android game scene
        run: timeout --signal=TERM --kill-after=15s 120s godot --headless --path . --quit-after 5

      - name: Regression — test_mens_scope.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_mens_scope.gd

      - name: Regression — test_anier_cumba_profile.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_anier_cumba_profile.gd

      - name: Regression — test_player_statistics_consistency.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_player_statistics_consistency.gd

      - name: Regression — test_season_progression.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_season_progression.gd

      - name: Regression — test_base_league_data.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_base_league_data.gd

      - name: Regression — test_ten_base_leagues_complete.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_ten_base_leagues_complete.gd

      - name: Regression — test_legend_career.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_legend_career.gd

      - name: Regression — test_nova_owner_access.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_nova_owner_access.gd

      - name: Regression — test_custom_player_roster.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_custom_player_roster.gd

      - name: Regression — test_moments_service.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_moments_service.gd

      - name: Regression — test_controller_support.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_controller_support.gd

      - name: Regression — test_nova_preferences_service.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_nova_preferences_service.gd

      - name: Regression — test_football_database.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_football_database.gd

      - name: Regression — test_shared_foundation.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_shared_foundation.gd

      - name: Regression — test_continental_league_modules.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_continental_league_modules.gd

      - name: Regression — test_tas_match_decision_engine.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_tas_match_decision_engine.gd

      - name: Regression — test_tas_competition_engine.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_tas_competition_engine.gd

      - name: Regression — test_competition_draw_ceremony.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_competition_draw_ceremony.gd

      - name: Regression — test_national_team_competition_catalog.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_national_team_competition_catalog.gd

      - name: Regression — test_caribbean_champions_league.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_caribbean_champions_league.gd

      - name: Regression — test_american_regional_champions_engine.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_american_regional_champions_engine.gd

      - name: Regression — test_usa_league_data.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_usa_league_data.gd

      - name: Regression — test_pending_league_calendars.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_pending_league_calendars.gd

      - name: Regression — test_league_and_manager_systems.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://tests/test_league_and_manager_systems.gd

      - name: Regression — validate_download_catalog.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://scripts/tests/validate_download_catalog.gd

      - name: Regression — validate_optional_modules.gd
        run: timeout --signal=TERM --kill-after=15s 180s godot --headless --path . --script res://scripts/tests/validate_optional_modules.gd

      - name: Export arm64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FutbolNova-debug.apk
          test -s build/FutbolNova-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-android-debug
          path: build/FutbolNova-debug.apk
          if-no-files-found: error
          retention-days: 14
